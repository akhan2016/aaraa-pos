        )}

        {tab === 'history' && (
          <div className="px-5 pt-4">
            {!isStaff && (<>
            <div className="rounded-xl p-4 mb-4" style={{ background: COLORS.primary }}>
              <div className="text-xs" style={{ color: '#F0D9E4' }}>Received today</div>
              <div className="text-2xl font-semibold text-white">{formatINR(todaysReceived)}</div>
              <div className="text-xs" style={{ color: '#F0D9E4' }}>
                {todaysSales.length} item{todaysSales.length === 1 ? '' : 's'} sold · {formatINR(todaysRevenue)} billed
                {todaysDue > 0 && ` · ${formatINR(todaysDue)} due`}
              </div>
            </div>
            <div className="rounded-xl p-3 mb-4" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}` }}>
              <div className="text-xs mb-2" style={{ color: COLORS.inkSoft }}>Totals — today</div>
              <div className="grid grid-cols-3 gap-2 text-center">
                <div>
                  <div className="text-xs" style={{ color: COLORS.inkSoft }}>Cash</div>
                  <div className="text-base font-semibold" style={{ color: COLORS.teal }}>{formatINR(todayTotals.cash)}</div>
                </div>
                <div>
                  <div className="text-xs" style={{ color: COLORS.inkSoft }}>Online</div>
                  <div className="text-base font-semibold" style={{ color: COLORS.teal }}>{formatINR(todayTotals.online)}</div>
                </div>
                <div>
                  <div className="text-xs" style={{ color: COLORS.inkSoft }}>Due</div>
                  <div className="text-base font-semibold" style={{ color: COLORS.rust }}>{formatINR(todayTotals.due)}</div>
                </div>
              </div>
            </div>
            </>)}
            {isStaff && (
              <div className="text-xs mb-3" style={{ color: COLORS.inkSoft }}>Showing today's bills only.</div>
            )}
            {sales.length === 0 ? (
              <div className="text-center py-16" style={{ color: COLORS.inkSoft }}>
                <div className="text-sm">No sales recorded yet.</div>
              </div>
            ) : (
              Object.entries(billsByDay).map(([day, bills]) => (
                <div key={day} className="mb-5">
                  <div className="mb-2">
                    <div className="text-xs font-medium" style={{ color: COLORS.inkSoft }}>{day}</div>
                    {!isStaff && (() => {
                      const t = sumSplits(bills);
                      return (
                        <div className="text-xs" style={{ color: COLORS.inkSoft }}>
                          Cash {formatINR(t.cash)} · Online {formatINR(t.online)} · Due {formatINR(t.due)}
                        </div>
                      );
                    })()}
                  </div>
                  <div className="space-y-2">
                    {bills.map((items) => {
                      const first = items[0];
                      const key = billKey(first);
                      const billTotal = items.reduce((sum, s) => sum + s.total, 0);
                      const itemCount = items.reduce((sum, s) => sum + s.qty, 0);
                      const billSplit = aggregateBillSplit(items);
                      const hasDue = billSplit.due > 0;
                      const sharedNote = items.find((s) => s.note)?.note;
                      const thumbProduct = products.find((p) => p.barcode === first.barcode);
                      const thumbImage = thumbProduct?.image;
                      const titleText = items.length === 1 ? first.name : `${first.name} + ${items.length - 1} more`;
                      return (
                        <button
                          key={key}
                          onClick={() => setViewingBillId(key)}
                          className="w-full flex items-center gap-3 rounded-lg p-3 text-left"
                          style={{ background: COLORS.card, border: `1px solid ${COLORS.border}` }}
                        >
                          <div
                            className="w-11 h-11 rounded-lg overflow-hidden flex-shrink-0 relative"
                            style={{ background: COLORS.chip }}
                            role={thumbImage ? 'button' : undefined}
                            onClick={thumbImage ? (e) => { e.stopPropagation(); setViewPhoto(thumbProduct); } : undefined}
                          >
                            {thumbImage && <img src={thumbImage} alt={first.name} className="w-full h-full object-cover" />}
                            {thumbImage && <span className="absolute flex items-center justify-center rounded-full" style={{ right: 2, bottom: 2, width: 18, height: 18, background: 'rgba(43,36,30,0.65)' }}><Search size={10} color="#fff" /></span>}
                          </div>
                          <div className="flex-1 min-w-0 flex items-center justify-between gap-2">
                            <div className="min-w-0">
                              <div className="text-sm font-medium truncate" style={{ color: COLORS.ink }}>{titleText}</div>
                              <div className="text-xs" style={{ color: COLORS.inkSoft }}>
                                {new Date(first.timestamp).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })} · {itemCount} item{itemCount === 1 ? '' : 's'}
                                {paymentSplitLabel(billSplit) && ` · ${paymentSplitLabel(billSplit)}`}
                              </div>
                              {sharedNote && <div className="text-xs mt-0.5 truncate" style={{ color: COLORS.gold }}>{sharedNote}</div>}
                              {(() => {
                                const inv = (items.find((s) => s.invoice) || {}).invoice;
                                if (!inv) return null;
                                return (
                                  <>
                                  {inv.customerName && (
                                    <div className="text-xs font-medium mt-0.5 truncate" style={{ color: COLORS.ink }}>
                                      Customer: {inv.customerName}{inv.customerMobile ? ` · ${inv.customerMobile}` : ''}
                                    </div>
                                  )}
                                  <span
                                    role="button"
                                    onClick={(e) => { e.stopPropagation(); setInvoiceItems(items); }}
                                    className="text-xs px-2 py-0.5 rounded-full inline-block mt-1 max-w-full truncate"
                                    style={{ background: COLORS.chip, color: COLORS.primary, border: `1px solid ${COLORS.border}` }}
                                  >
                                    Invoice {inv.no}{inv.customerName ? ` · ${inv.customerName}` : ''}{inv.basis === 'online' ? ' · online part' : ''}
                                  </span>
                                  </>
                                );
                              })()}
                            </div>
                            <div className="flex items-center gap-2 flex-shrink-0">
                              <div className="text-right">
                                {hasDue && (
                                  <span className="text-xs px-2 py-0.5 rounded-full inline-block mb-0.5" style={{ background: '#F5E4DD', color: COLORS.rust }}>
                                    Due {formatINR(billSplit.due)}
                                  </span>
                                )}
                                <div className="text-sm font-medium" style={{ color: COLORS.teal }}>{formatINR(billSplit.cash + billSplit.online)}</div>
                                {hasDue && (
                                  <div className="text-xs" style={{ color: COLORS.inkSoft }}>of {formatINR(billTotal)} billed</div>
                                )}
                              </div>
                            </div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))
            )}
          </div>
        )}
      </div>

      {tab === 'catalog' && (
        <button
          onClick={() => setEditing('new')}
          className="absolute bottom-24 right-5 w-14 h-14 rounded-full flex items-center justify-center shadow-lg"
          style={{ background: COLORS.primary }}
        >
          <Plus size={24} color="#fff" />
        </button>
      )}

      {tab === 'sell' && cart.length > 0 && (
        <div className="absolute bottom-16 left-0 right-0 px-5 pb-2">
          <button
            onClick={completeSale}
            disabled={saleInProgress || paymentAssigned !== cartTotal || invoiceMissing || ((Number(payDue) || 0) > 0 && !saleNote.trim())}
            className="w-full rounded-xl py-3 flex items-center justify-between px-4 shadow-lg"
            style={{
              background: COLORS.primary,
              opacity: saleInProgress || paymentAssigned !== cartTotal || invoiceMissing || ((Number(payDue) || 0) > 0 && !saleNote.trim()) ? 0.5 : 1,
            }}
          >
            <span className="text-white font-medium">{saleInProgress ? 'Recording…' : 'Complete sale'}</span>
            <span className="text-white font-semibold">{formatINR(cartTotal)}</span>
          </button>
        </div>
      )}

      <div className="absolute bottom-0 left-0 right-0 flex" style={{ background: COLORS.card, borderTop: `1px solid ${COLORS.border}` }}>
        {[
          { key: 'sell', label: 'Sell', icon: Scan },
          { key: 'catalog', label: 'Catalog', icon: LayoutGrid },
          { key: 'history', label: 'History', icon: Receipt },
        ].map(({ key, label, icon: Icon }) => (
          <button key={key} onClick={() => setTab(key)} className="flex-1 flex flex-col items-center gap-1 py-2.5">
            <Icon size={20} color={tab === key ? COLORS.primary : COLORS.inkSoft} />
            <span className="text-xs" style={{ color: tab === key ? COLORS.primary : COLORS.inkSoft }}>{label}</span>
          </button>
        ))}
      </div>

      {toast && (
        <div className="absolute top-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full text-sm text-white shadow-lg" style={{ background: COLORS.ink, maxWidth: '90%' }}>
          {toast}
        </div>
      )}

      {editing && (
        <ProductForm
          product={editing === 'new' ? null : editing}
          onCancel={() => setEditing(null)}
          onSave={saveProduct}
          onDelete={editing !== 'new' ? () => deleteProduct(editing.barcode) : null}
          generateBarcode={generateBarcode}
          onPrintOne={
            editing !== 'new'
              ? () => triggerPrint([{ barcode: editing.barcode, name: editing.name, price: editing.price, handwork: editing.handwork || [] }])
              : null
          }
        />
      )}

      {printOpen && (
        <PrintLabelsModal
          products={products}
          selection={printSelection}
          onToggle={togglePrintItem}
          onSetQty={setPrintQty}
          onClose={() => setPrintOpen(false)}
          onPrint={handlePrintSelected}
          btName={btName}
          onConnect={connectPrinter}
        />
      )}

      {viewPhoto && <PhotoViewer product={products.find((x) => x.barcode === viewPhoto.barcode) || viewPhoto} onClose={() => { setViewPhoto(null); setTimeout(() => scanRef.current && scanRef.current.focus(), 60); }} />}
      {invoiceItems && <InvoiceModal items={invoiceItems} onClose={() => setInvoiceItems(null)} />}

      {viewingBillId && viewingBillItems.length > 0 && (
        <BillDetailModal
          items={viewingBillItems}
          onInvoice={() => setInvoiceItems(viewingBillItems)}
          onZoom={(prod) => setViewPhoto(prod)}
          products={products}
          onClose={() => setViewingBillId(null)}
          onEditItem={isStaff ? undefined : (item) => setEditingSale(item)}
        />
      )}

      {cameraOpen && <CameraScanner onScan={handleCameraScan} onClose={() => setCameraOpen(false)} />}

      {editingSale && (
        <SaleEditModal
          sale={editingSale}
          image={products.find((p) => p.barcode === editingSale.barcode)?.image}
          onCancel={() => setEditingSale(null)}
          onSave={async (updated) => {
            const result = await updateSaleRecord(editingSale, updated);
            if (result === true) setEditingSale(null);
            return result;
          }}
          onDelete={async () => {
            const ok = await deleteSaleRecord(editingSale);
            if (ok) {
              setEditingSale(null);
              setToast('Sale deleted, stock restored');
            }
            return ok;
          }}
        />
      )}
      </div>

      <div id="print-labels-sheet">
        {printItems.map((item, i) => (
          <PrintLabel key={`${item.barcode}-${i}`} name={item.name} price={item.price} barcode={item.barcode} handwork={item.handwork} />
        ))}
      </div>
    </>
  );
}

function ProductForm({ product, onCancel, onSave, onDelete, generateBarcode, onPrintOne }) {
  const [name, setName] = useState(product?.name || '');
  const [price, setPrice] = useState(product?.price ?? '');
  const [barcode, setBarcode] = useState(() => (product ? product.barcode || '' : generateBarcode())); // new suits get a barcode automatically
  const [stock, setStock] = useState(product ? (product.stock ?? '') : '1'); // new suits start with stock 1
  const [topFabric, setTopFabric] = useState(product?.topFabric || '');
  const [bottomFabric, setBottomFabric] = useState(product?.bottomFabric || '');
  const [dupattaFabric, setDupattaFabric] = useState(product?.dupattaFabric || '');
  const [handwork, setHandwork] = useState(product?.handwork || []);
  function toggleHandwork(tag) {
    setHandwork((prev) => {
      if (prev.includes(tag)) return prev.filter((t) => t !== tag);
      // 1 Bunch and 2 Bunch exclude each other
      const base = HANDWORK_BUNCH.includes(tag) ? prev.filter((t) => !HANDWORK_BUNCH.includes(t)) : prev;
      return [...base, tag];
    });
  }
  const [drag, setDrag] = useState(null);
  const MAX_PHOTOS = 4;
  const [images, setImages] = useState(
    product?.images && product.images.length ? product.images : product?.image ? [product.image] : []
  );
  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);
  const [scanningBarcode, setScanningBarcode] = useState(false);

  // Called by the camera scanner when it reads a pre-printed barcode: fill the
  // field with it and close the scanner right away.
  function handleBarcodeScanned(code) {
    setBarcode(code);
    setError('');
    setScanningBarcode(false);
    return { ok: true, text: `Scanned ${code}` };
  }

  async function handleImage(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = ''; // lets the same photo be picked again later
    if (files.length === 0) return;
    setError('');
    try {
      const added = [];
      for (const file of files.slice(0, MAX_PHOTOS - images.length)) {
        added.push(await resizeImage(file, photoSettings().maxW, photoSettings().quality));
      }
      if (added.length) setImages((prev) => [...prev, ...added].slice(0, MAX_PHOTOS));
      if (files.length > MAX_PHOTOS - images.length) setError(`Only ${MAX_PHOTOS} photos per suit — extra ones were skipped`);
    } catch (err) {
      setError('Could not load that photo');
    }
  }

  function removePhoto(index) {
    setImages((prev) => prev.filter((_, i) => i !== index));
  }

  // Drag a photo onto another slot to move it there (works with finger or mouse).
  function photoIndexAt(x, y) {
    const tiles = document.querySelectorAll('[data-photo]');
    for (const t of tiles) {
      const r = t.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return Number(t.getAttribute('data-photo'));
    }
    return null;
  }
  function onPhotoDown(e, i) {
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    setDrag({ from: i, over: i, sx: e.clientX, sy: e.clientY, dx: 0, dy: 0 });
  }
  function onPhotoMove(e) {
    if (!drag) return;
    const over = photoIndexAt(e.clientX, e.clientY);
    setDrag({ ...drag, over: over !== null && over < images.length ? over : drag.over, dx: e.clientX - drag.sx, dy: e.clientY - drag.sy });
  }
  function onPhotoUp() {
    if (drag && drag.over !== drag.from) {
      setImages((prev) => {
        const next = prev.slice();
        const [moved] = next.splice(drag.from, 1);
        next.splice(drag.over, 0, moved);
        return next;
      });
    }
    setDrag(null);
  }

  async function handleSubmit() {
    setError('');
    if (!price || !barcode.trim()) {
      setError('Price and barcode are required');
      return;
    }
    if (images.reduce((n, s) => n + s.length, 0) > photoSettings().totalLimit) {
      setError('The photos are too large to save together — remove one and try again.');
      return;
    }
    setSaving(true);
    const result = await onSave({ name, price, barcode, stock, topFabric, bottomFabric, dupattaFabric, handwork, image: images[0] || null, images });
    setSaving(false);
    if (result === 'duplicate') setError('Another suit already uses this barcode');
    if (result === 'failed') setError('Could not save — this browser refused to store the data. Try removing a photo, or use Export backup to keep a copy and then clear old suits.');
  }

  return (
    <div className="fixed inset-0 flex items-end justify-center z-10" style={{ background: 'rgba(43,36,30,0.5)' }}>
      {scanningBarcode && <CameraScanner onScan={handleBarcodeScanned} onClose={() => setScanningBarcode(false)} />}
      <div className="w-full rounded-t-2xl overflow-y-auto" style={{ background: COLORS.bg, maxHeight: "85vh" }}>
        <div className="flex items-center justify-between px-5 pt-5 pb-3">
          <div className="text-lg font-semibold" style={{ color: COLORS.ink }}>{product ? 'Edit suit' : 'Add suit'}</div>
          <button onClick={onCancel}><X size={20} color={COLORS.inkSoft} /></button>
        </div>

        <div className="px-5 pb-5">
        <div className="space-y-3">
          <div>
            <div className="grid grid-cols-4 gap-2">
              {Array.from({ length: MAX_PHOTOS }).map((_, i) => {
                const src = images[i];
                if (src) {
                  return (
                    <div
                      key={i}
                      data-photo={i}
                      onPointerDown={(e) => onPhotoDown(e, i)}
                      onPointerMove={onPhotoMove}
                      onPointerUp={onPhotoUp}
                      onPointerCancel={() => setDrag(null)}
                      className="relative rounded-xl overflow-hidden aspect-square"
                      style={{
                        background: COLORS.chip,
                        touchAction: 'none',
                        cursor: 'grab',
                        userSelect: 'none',
                        outline: drag && drag.over === i && drag.from !== i ? `3px solid ${COLORS.primary}` : 'none',
                        outlineOffset: '-3px',
                        transform: drag && drag.from === i ? `translate(${drag.dx}px, ${drag.dy}px) scale(1.08)` : 'none',
                        zIndex: drag && drag.from === i ? 20 : 'auto',

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e2) {
      return false;
    }
  }
}

function InvoiceModal({ items, onClose }) {
  const [preview, setPreview] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const canvasRef = useRef(null);
  const data = buildInvoiceData(items);
  const [copied, setCopied] = useState(false);

  async function copyMobile() {
    if (!data.mobile) return;
    const ok = await copyText(data.mobile);
    setCopied(ok);
    if (ok) setTimeout(() => setCopied(false), 4000);
  }

  // Best effort: copy the customer's number as soon as the invoice opens (some browsers only allow it on a tap)
  useEffect(() => {
    if (data.mobile) copyText(data.mobile).then(setCopied);
    // eslint-disable-next-line
  }, []);

  useEffect(() => {
    let alive = true;
    drawInvoiceCanvas(buildInvoiceData(items)).then((c) => {
      if (!alive) return;
      canvasRef.current = c;
      setPreview(c.toDataURL('image/jpeg', 0.85));
    });
    return () => { alive = false; };
  }, [items]);

  async function share() {
    if (!canvasRef.current || busy) return;
    setBusy(true);
    setMsg('');
    if (data.mobile) copyMobile(); // copy first (needs the tap), so it can be pasted in WhatsApp search
    try {
      const r = await shareInvoicePdf(data, canvasRef.current);
      if (r === 'saved') setMsg('Invoice PDF saved');
    } catch (e) {
      setMsg('Could not create the invoice PDF');
    }
    setBusy(false);
  }

  return (
    <div className="fixed inset-0 flex items-end justify-center z-20" style={{ background: 'rgba(43,36,30,0.6)' }}>
      <div className="w-full rounded-t-2xl overflow-y-auto" style={{ background: COLORS.bg, maxHeight: '92vh' }}>
        <div className="flex items-center justify-between px-5 pt-5 pb-3">
          <div className="text-lg font-semibold" style={{ color: COLORS.ink }}>Invoice {data.no}</div>
          <button onClick={onClose}><X size={20} color={COLORS.inkSoft} /></button>
        </div>
        <div className="px-5 pb-5">
          {data.mobile && (
            <button
              type="button"
              onClick={copyMobile}
              className="w-full rounded-xl py-2 mb-2 text-sm flex items-center justify-center gap-2"
              style={{ background: COLORS.chip, color: COLORS.primary, border: `1px solid ${COLORS.border}` }}
            >
              {copied ? `Copied ${data.mobile} — paste in WhatsApp search` : `Copy mobile ${data.mobile}`}
            </button>
          )}
          <button
            type="button"
            onClick={share}
            disabled={!preview || busy}
            className="w-full rounded-xl py-3 font-medium text-white mb-3"
            style={{ background: COLORS.primary, opacity: !preview || busy ? 0.5 : 1 }}
          >
            {busy ? 'Preparing…' : 'Share / save invoice PDF'}
          </button>
          {msg && <div className="text-xs mb-2" style={{ color: COLORS.teal }}>{msg}</div>}
          {preview ? (
            <img src={preview} alt="Invoice" className="w-full rounded-lg" style={{ border: `1px solid ${COLORS.border}` }} />
          ) : (
            <div className="text-sm text-center py-10" style={{ color: COLORS.inkSoft }}>Preparing invoice…</div>
          )}
          <button type="button" onClick={onClose} className="w-full rounded-xl py-3 mt-3 font-medium" style={{ background: COLORS.chip, color: COLORS.primary }}>
            Close
          </button>
        </div>
      </div>
    </div>
  );
}

  const [qty, setQty] = useState(sale.qty);

  const [note, setNote] = useState(sale.note || '');
  const existingSplit = getPaymentSplit(sale) || { cash: 0, online: 0, due: 0 };
  const [editCash, setEditCash] = useState(String(existingSplit.cash || ''));
  const [editOnline, setEditOnline] = useState(String(existingSplit.online || ''));
  const [editDue, setEditDue] = useState(String(existingSplit.due || ''));
  const [error, setError] = useState('');
  const [saving, setSaving] = useState(false);
  const [deleting, setDeleting] = useState(false);

  const lineTotal = Number(qty || 0) * Number(price || 0);
  const editAssigned = (Number(editCash) || 0) + (Number(editOnline) || 0) + (Number(editDue) || 0);

  async function handleSave() {
    setError('');
    if (!qty || Number(qty) <= 0) {
      setError('Quantity must be at least 1');
      return;
    }
    if ((Number(editDue) || 0) > 0 && !note.trim()) {
      setError('Add the customer\'s name and phone number in the Note field — required when a due amount is set');
      return;
    }
    setSaving(true);
    const result = await onSave({
      qty: Number(qty),
      price: Number(price),
      note,
      paymentSplit: { cash: Number(editCash) || 0, online: Number(editOnline) || 0, due: Number(editDue) || 0 },
    });
    setSaving(false);
    if (result === 'invalid') setError('Quantity must be at least 1');
    if (result === 'failed') setError('Could not save this change — please try again');
  }

  async function handleDelete() {
    setDeleting(true);
    const ok = await onDelete();
    setDeleting(false);
    if (!ok) setError('Could not delete this sale — please try again');

  return (

              <div className="grid grid-cols-3 gap-2">
                <Field label="Cash ₹">
                  <input type="number" inputMode="decimal" value={editCash} onChange={(e) => setEditCash(e.target.value)} placeholder="0" className="w-full outline-none bg-transparent text-sm" style={{ color: COLORS.ink }} />
                </Field>
                <Field label="Online ₹">
                  <input type="number" inputMode="decimal" value={editOnline} onChange={(e) => setEditOnline(e.target.value)} placeholder="0" className="w-full outline-none bg-transparent text-sm" style={{ color: COLORS.ink }} />
                </Field>
                <Field label="Due ₹">
                  <input type="number" inputMode="decimal" value={editDue} onChange={(e) => setEditDue(e.target.value)} placeholder="0" className="w-full outline-none bg-transparent text-sm" style={{ color: COLORS.ink }} />
                </Field>
              </div>
              <div className="text-xs mt-1" style={{ color: editAssigned === lineTotal ? COLORS.teal : COLORS.rust }}>
                {editAssigned === lineTotal ? 'Matches line total' : `Assigned ${formatINR(editAssigned)} of ${formatINR(lineTotal)}`}
              </div>
            </div>

            <Field label={(Number(editDue) || 0) > 0 ? 'Note — required (name & phone, due amount set)' : 'Note'}>
              <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="Customer name, phone, discount reason" className="w-full outline-none bg-transparent text-sm" style={{ color: COLORS.ink }} />
            </Field>

            <div className="flex items-center justify-between px-1">
              <span className="text-sm" style={{ color: COLORS.inkSoft }}>New total</span>
              <span className="text-base font-semibold" style={{ color: COLORS.ink }}>{formatINR(Number(qty || 0) * Number(price || 0))}</span>
            </div>

            {error && <div className="text-sm" style={{ color: COLORS.rust }}>{error}</div>}

            <div className="flex gap-2 pt-2">
              <button type="button" onClick={handleDelete} disabled={deleting} className="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0" style={{ background: '#F5E4DD', opacity: deleting ? 0.7 : 1 }}>
                <Trash2 size={18} color={COLORS.rust} />
              </button>
              <button type="button" onClick={handleSave} disabled={saving} className="flex-1 rounded-xl py-3 font-medium text-white" style={{ background: COLORS.primary, opacity: saving ? 0.7 : 1 }}>
                {saving ? 'Saving…' : 'Save changes'}
              </button>
            </div>
            <div className="text-xs text-center" style={{ color: COLORS.inkSoft }}>
              Changing quantity adjusts this suit's stock count accordingly.
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function CameraScanner({ onScan, onClose }) {
  const videoRef = useRef(null);
  const onScanRef = useRef(onScan);
  onScanRef.current = onScan; // always call the latest handler (it reads current cart state)
  const [error, setError] = useState('');
  const [status, setStatus] = useState(null);
  const [count, setCount] = useState(0);

  useEffect(() => {
    let stream = null;
    let timer = null;
    let cancelled = false;
    let lastCode = '';
    let lastTime = 0;

    async function start() {
      if (!('BarcodeDetector' in window)) {
        setError("This browser can't detect barcodes from the camera. Please use Chrome on Android.");
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setError('Camera access is not available here.');
        return;
      }
      let detector;
      try {
        detector = new window.BarcodeDetector({ formats: ['code_128', 'ean_13', 'ean_8', 'upc_a', 'code_39'] });
      } catch (e) {
        detector = new window.BarcodeDetector();
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      } catch (e) {
        if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
          setError('Camera is blocked. Tap the lock icon in Chrome\'s address bar → Permissions → allow Camera, then reopen the scanner. (If it stays blocked, this page may not be allowed to use the camera.)');
        } else {
          setError(`Could not start the camera (${(e && e.name) || 'error'}).`);
        }
        return;
      }
      if (cancelled) {
        stream.getTracks().forEach((t) => t.stop());
        return;
      }
      const video = videoRef.current;
      if (!video) return;
      video.srcObject = stream;
      try { await video.play(); } catch (e) {}

      timer = setInterval(async () => {
        if (!video || video.readyState < 2) return;
        try {
          const found = await detector.detect(video);
          if (found.length === 0) return;
          const code = found[0].rawValue;
          const now = Date.now();
          if (code === lastCode && now - lastTime < 1800) return; // ignore repeat reads of the same barcode
          lastCode = code;
          lastTime = now;
          const result = onScanRef.current(code);
          setStatus(result);
          if (result.ok) {
            setCount((c) => c + 1);
            try { navigator.vibrate && navigator.vibrate(80); } catch (e) {}
          }
        } catch (e) {}
      }, 250);
    }

    start();
    return () => {
      cancelled = true;
      if (timer) clearInterval(timer);
      if (stream) stream.getTracks().forEach((t) => t.stop());
    };
  }, []);

  return (
    <div className="fixed inset-0 flex flex-col z-10" style={{ background: '#000' }}>
      <div className="flex items-center justify-between px-5 py-4">
        <div className="text-white font-semibold">Scan with camera</div>
        <button onClick={onClose}><X size={22} color="#fff" /></button>
      </div>

      <div className="flex-1 flex items-center justify-center px-3" style={{ minHeight: 0 }}>
        {error ? (
          <div className="text-sm text-center px-4" style={{ color: '#F5D0C5' }}>{error}</div>
        ) : (
          <div className="relative w-full" style={{ maxWidth: '480px' }}>
            <video ref={videoRef} playsInline muted autoPlay style={{ width: '100%', maxHeight: '60vh', objectFit: 'cover', borderRadius: '12px', background: '#111' }} />
            <div
              className="absolute"
              style={{ left: '10%', right: '10%', top: '50%', height: '2px', background: 'rgba(255,80,80,0.85)', pointerEvents: 'none' }}
            />
          </div>
        )}
      </div>

      <div className="px-5 py-4" style={{ minHeight: '96px' }}>
        {status && (
          <div className="text-sm text-center mb-2" style={{ color: status.ok ? '#9BE3C6' : '#F5D0C5' }}>{status.text}</div>
        )}
        <div className="text-xs text-center mb-3" style={{ color: '#bbb' }}>
          Hold a suit's barcode in front of the camera. Keeps scanning until you tap Done.
        </div>
        <button onClick={onClose} className="w-full rounded-xl py-3 font-medium text-white" style={{ background: COLORS.primary }}>
          Done{count > 0 ? ` (${count} added)` : ''}
        </button>
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div className="rounded-xl px-3 py-2" style={{ background: '#FFFFFF', border: `1px solid ${COLORS.border}` }}>
      <div className="text-xs mb-0.5" style={{ color: COLORS.inkSoft }}>{label}</div>
      {children}
    </div>
  );
}
