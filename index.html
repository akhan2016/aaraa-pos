function formatINR(n) {
  return '₹' + Number(n || 0).toLocaleString('en-IN');
}

// A payment split is { cash, online, due } in rupees. Returns a short label:
// the single mode's name if only one is nonzero, "Split" if more than one is,
// or null if the split is empty/unset (e.g. legacy sales recorded before this feature).
function paymentSplitLabel(split) {
  if (!split) return null;
  const cash = Number(split.cash) || 0;
  const online = Number(split.online) || 0;
  const due = Number(split.due) || 0;
  if (cash === 0 && online === 0 && due === 0) return null;
  if (due > 0) return cash + online > 0 ? 'Received + Due' : 'Balance Due';
  if (cash > 0 && online > 0) return 'Cash + Online';
  if (cash > 0) return 'Cash';
  if (online > 0) return 'Paid Online';
  return null;
}

function paymentSplitText(split) {
  if (!split) return '';
  const parts = [];
  if (Number(split.cash) > 0) parts.push(`Cash ${formatINR(split.cash)}`);
  if (Number(split.online) > 0) parts.push(`Online ${formatINR(split.online)}`);
  if (Number(split.due) > 0) parts.push(`Due ${formatINR(split.due)}`);
  return parts.join(' + ');
}

// Sales recorded before split payments existed have a single `paymentMode` string
// instead of a `paymentSplit` object — this reconstructs an equivalent split for them.
function getPaymentSplit(sale) {
  if (sale.paymentSplit) return sale.paymentSplit;
  if (sale.paymentMode) {
    return {
      cash: sale.paymentMode === 'Cash' ? sale.total : 0,
      online: sale.paymentMode === 'Paid Online' ? sale.total : 0,
      due: sale.paymentMode === 'Balance Due' ? sale.total : 0,
    };
  }
  return null;
}

// Combines the per-item payment splits of every line in one bill into a bill-level
// total. Normally that's a plain sum, since each item carries its own true share.
// But bills recorded by an earlier version of this app copied the *whole* bill's
// split onto every item instead of prorating it — detectable because every item
// in the bill then has the exact same nonzero split. In that case, count it once
// instead of summing, so old data still totals correctly.
function aggregateBillSplit(items) {
  const splits = items.map((s) => getPaymentSplit(s) || { cash: 0, online: 0, due: 0 });
  const first = splits[0];
  const hasAmount = Number(first.cash) > 0 || Number(first.online) > 0 || Number(first.due) > 0;
  const allIdentical = splits.every(
    (sp) => Number(sp.cash) === Number(first.cash) && Number(sp.online) === Number(first.online) && Number(sp.due) === Number(first.due)
  );
  if (items.length > 1 && hasAmount && allIdentical) {
    return { cash: Number(first.cash) || 0, online: Number(first.online) || 0, due: Number(first.due) || 0 };
  }
  return splits.reduce(
    (acc, sp) => {
      acc.cash += Number(sp.cash) || 0;
      acc.online += Number(sp.online) || 0;
      acc.due += Number(sp.due) || 0;
      return acc;
    },
    { cash: 0, online: 0, due: 0 }
  );
}

// Inside claude.ai a record must stay small, so photos are small. On your own site (shared database)
// there is room for sharper photos, which look much better when zoomed.
function photoSettings() {
  const inClaude = typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function';
  return inClaude ? { maxW: 420, quality: 0.6, totalLimit: 200000 } : { maxW: 900, quality: 0.72, totalLimit: 1500000 };
}

function resizeImage(file, maxW = 500, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const CODE128_START_B = 104;
const CODE128_STOP_PATTERN = '233111';

// Encodes text as Code 128 (Code Set B, ASCII 32-126) into a string of alternating
// bar/space module widths, starting with a bar. Returns null for unsupported characters.
function buildCode128Widths(text) {
  if (!text) return null;
  const values = [];
  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);
    if (code < 32 || code > 126) return null;
    values.push(code - 32);
  }
  const symbols = [CODE128_START_B, ...values];
  let sum = symbols[0];
  for (let i = 1; i < symbols.length; i++) sum += i * symbols[i];
  const check = sum % 103;
  const fullSymbols = [...symbols, check];
  let widthStr = fullSymbols.map((v) => CODE128_PATTERNS[v]).join('');
  widthStr += CODE128_STOP_PATTERN + '2';
  return widthStr;
}

function BarcodeSVG({ value, height = 50, moduleWidth = 2 }) {
  const widths = buildCode128Widths(value);
  if (!widths) return null;
  let x = 0;
  const bars = [];
  for (let i = 0; i < widths.length; i++) {
    const w = Number(widths[i]) * moduleWidth;
    if (i % 2 === 0) bars.push(<rect key={i} x={x} y={0} width={w} height={height} fill="#000" />);
    x += w;
  }
  return (
    <svg viewBox={`0 0 ${x} ${height}`} width="100%" height={height} style={{ background: '#fff', display: 'block' }}>
      {bars}
    </svg>
  );
}

// Local (no shared database) storage. localStorage only holds a few MB, which photos fill
// quickly, so use IndexedDB (far larger) and fall back to localStorage if it is unavailable.
const localStore = (() => {
  let dbPromise = null;
  function open() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        try {
          const req = indexedDB.open('aaraa-pos', 1);
          req.onupgradeneeded = () => req.result.createObjectStore('kv');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        } catch (e) {
          reject(e);
        }
      });
    }
    return dbPromise;
  }
  function idbGet(key) {
    return open().then((db) => new Promise((resolve, reject) => {
      const r = db.transaction('kv', 'readonly').objectStore('kv').get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    }));
  }
  function idbSet(key, value) {
    return open().then((db) => new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    }));
  }
  return {
    async get(key) {
      try {
        const v = await idbGet(key);
        if (v !== undefined) return v;
      } catch (e) {}
      try {
        const raw = localStorage.getItem(key); // older data saved before IndexedDB was used
        return raw ? JSON.parse(raw) : undefined;
      } catch (e) {
        return undefined;
      }
    },
    async set(key, value) {
      try {
        await idbSet(key, value);
        try { localStorage.removeItem(key); } catch (e) {}
        return true;
      } catch (e) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (e2) {
          console.error('local save failed', e2);
          return false;
        }
      }
    },
  };
})();

function invoiceFinancialYear(date) {
  const d = new Date(date);
  const y = d.getFullYear();
  const start = d.getMonth() >= 3 ? y : y - 1; // financial year runs April to March
  return `${String(start).slice(2)}-${String(start + 1).slice(2)}`;
}
function nextInvoiceSeq(sales) {
  return sales.reduce((m, x) => Math.max(m, (x.invoice && x.invoice.seq) || 0), 0) + 1;
}
function makeInvoiceMeta(seq, date, name, mobile, basis, amount) {
  // basis 'full' = invoice for the whole bill; 'online' = invoice only for the part paid online (amount)
  return { seq, no: `AC/${invoiceFinancialYear(date)}/${String(seq).padStart(4, '0')}`, customerName: name, customerMobile: mobile, basis: basis || 'full', amount };
}

function numberToWordsIN(num) {
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = (n) => (n < 20 ? ones[n] : tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : ''));
  const three = (n) => (n >= 100 ? ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + two(n % 100) : '') : two(n));
  function words(n) {
    if (n === 0) return 'Zero';
    const parts = [];
    const crore = Math.floor(n / 10000000); n %= 10000000;
    const lakh = Math.floor(n / 100000); n %= 100000;
    const thousand = Math.floor(n / 1000); n %= 1000;
    if (crore) parts.push(three(crore) + ' Crore');
    if (lakh) parts.push(three(lakh) + ' Lakh');
    if (thousand) parts.push(three(thousand) + ' Thousand');
    if (n) parts.push(three(n));
    return parts.join(' ');
  }
  const total = round2(num);
  const rupees = Math.floor(total);
  const paise = Math.round((total - rupees) * 100);
  return `Rupees ${words(rupees)}${paise ? ' and ' + words(paise) + ' Paise' : ''} Only`;
}

// Works out every invoice figure from the sale lines of one bill. Each suit gets its own row.
function buildInvoiceData(items) {
  const meta = (items.find((x) => x.invoice) || {}).invoice || {};
  const rows = [];
  for (const x of items) {
    const qty = Math.max(1, Number(x.qty) || 1);
    let left = round2(Number(x.total || 0));
    for (let i = 0; i < qty; i++) {
      const amount = i === qty - 1 ? left : round2(Number(x.total || 0) / qty); // what the customer pays for this suit
      left = round2(left - amount);
      const taxable = round2(amount / (1 + INVOICE_GST_RATE / 100));
      rows.push({ meters: INVOICE_METERS_PER_SUIT, rate: taxable / INVOICE_METERS_PER_SUIT, taxable, amount });
    }
  }
  let split = aggregateBillSplit(items);
  const fullTotal = round2(rows.reduce((sum, r) => sum + r.amount, 0)); // after any bargaining
  if (meta.basis === 'online' && Number(meta.amount) > 0 && Number(meta.amount) < fullTotal) {
    // Invoice only the online part: scale every suit's amount down in proportion.
    const target = round2(Number(meta.amount));
    let left = target;
    rows.forEach((r, i) => {
      const amount = i === rows.length - 1 ? left : round2((r.amount * target) / fullTotal);
      left = round2(left - amount);
      r.amount = amount;
      r.taxable = round2(amount / (1 + INVOICE_GST_RATE / 100));
      r.rate = r.taxable / INVOICE_METERS_PER_SUIT;
    });
    split = { cash: 0, online: target, due: 0 };
  }
  const total = round2(rows.reduce((sum, r) => sum + r.amount, 0));
  const taxable = round2(rows.reduce((sum, r) => sum + r.taxable, 0));
  return {
    no: meta.no || '',
    date: items[0].timestamp,
    name: meta.customerName || '',
    mobile: meta.customerMobile || '',
    rows,
    taxable,
    gst: round2(total - taxable),
    total,
    split,
  };
}

function loadImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

// One-page PDF around a JPEG image.
function buildSinglePagePdf(jpeg, imgW, imgH, pageW, pageH) {
  const enc = new TextEncoder();
  const chunks = [];
  const offsets = [];
  let offset = 0;
  const push = (d) => {
    const u = typeof d === 'string' ? enc.encode(d) : d;
    chunks.push(u);
    offset += u.length;
  };
  push('%PDF-1.4\n');
  offsets[1] = offset;
  push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offsets[2] = offset;
  push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  offsets[3] = offset;
  push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>\nendobj\n`);
  const content = `q ${pageW} 0 0 ${pageH} 0 0 cm /Im0 Do Q`;
  offsets[4] = offset;
  push(`4 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  offsets[5] = offset;
  push(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
  push(jpeg);
  push('\nendstream\nendobj\n');
  const xrefPos = offset;
  let xref = 'xref\n0 6\n0000000000 65535 f \n';
  for (let k = 1; k <= 5; k++) xref += `${String(offsets[k]).padStart(10, '0')} 00000 n \n`;
  push(xref);
  push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`);
  return new Blob(chunks, { type: 'application/pdf' });
}

// Shares the invoice PDF (WhatsApp etc. via the phone's share sheet), else saves it.
async function shareInvoicePdf(d, canvas) {
  const jpeg = await canvasToJpegBytes(canvas);
  const blob = buildSinglePagePdf(jpeg, canvas.width, canvas.height, 595.28, (595.28 * canvas.height) / canvas.width);
  const filename = `Invoice-${(d.no || 'Aaraa').replace(/[^A-Za-z0-9-]/g, '-')}.pdf`;
  try {
    const file = new File([blob], filename, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: `Invoice ${d.no}` });
      return 'shared';
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return 'cancelled';
  }
  const downloads = await getClaudeCap('downloads');
  if (downloads) {
    try {
      await downloads.save({ filename, data: blob });
      return 'saved';
    } catch (e) {
      if (e && e.code === 'declined') return 'cancelled';
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return 'saved';
}

// Handwork options shown as tap-chips in the suit form and printed on the label.
const HANDWORK_PARTS = ['Front', 'Back', 'Neck', 'Daaman', 'Sleeves', 'Bottom', 'Dupatta'];
const HANDWORK_BUNCH = ['1 Bunch', '2 Bunch'];
function handworkText(list) {
  const all = HANDWORK_PARTS.concat(HANDWORK_BUNCH);
  return (list || []).slice().sort((a, b) => all.indexOf(a) - all.indexOf(b)).join(', ');
}

// ---- Label PDF export (for Bluetooth label printers that print via their own app) ----
// Draws one 50x25mm label (400x200px, 8px per mm) onto a canvas.
function drawLabelCanvas(item, W = 400, H = 200) {
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Name, shrunk with an ellipsis until it fits
  let name = String(item.name || '');
  ctx.font = '600 22px sans-serif';
  while (name.length > 1 && ctx.measureText(name).width > W - 20) name = name.slice(0, -2) + '…';
  ctx.fillText(name, W / 2, 20);
  const hw = handworkText(item.handwork);
  // With handwork details the barcode is a little shorter to make room for up to 2 text lines.
  let hwLines = [];
  if (hw) {
    ctx.font = '700 19px sans-serif';
    let line = '';
    for (const word of hw.split(' ')) {
      const test = line ? line + ' ' + word : word;
      if (line && ctx.measureText(test).width > W - 16) { hwLines.push(line); line = word; } else line = test;
    }
    if (line) hwLines.push(line);
    hwLines = hwLines.slice(0, 2);
  }
  const barTop = hw ? 60 : 68;
  const barBottom = hw ? 118 : H - 48;
  ctx.font = '700 24px sans-serif';
  ctx.fillText(formatINR(item.price), W / 2, hw ? 44 : 50);
  // Barcode: whole-pixel module width keeps bars crisp for thermal printing
  const widths = buildCode128Widths(item.barcode);
  if (widths) {
    let totalModules = 0;
    for (let i = 0; i < widths.length; i++) totalModules += Number(widths[i]);
    const mod = Math.max(1, Math.floor((W - 20) / totalModules));
    let x = Math.floor((W - totalModules * mod) / 2);
    for (let i = 0; i < widths.length; i++) {
      const w = Number(widths[i]) * mod;
      if (i % 2 === 0) ctx.fillRect(x, barTop, w, barBottom - barTop);
      x += w;
    }
  }
  ctx.font = hw ? '18px monospace' : '20px monospace';
  ctx.fillText(String(item.barcode), W / 2, hw ? 130 : H - 24);
  if (hw) {
    ctx.font = '700 19px sans-serif';
    hwLines.forEach((l, i) => ctx.fillText(l, W / 2, 154 + i * 24));
  }
  return canvas;
}

function canvasToJpegBytes(canvas) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(
      async (blob) => {
        if (!blob) return reject(new Error('jpeg encode failed'));
        resolve(new Uint8Array(await blob.arrayBuffer()));
      },
      'image/jpeg',
      0.95
    );
  });
}

// Builds a minimal multi-page PDF (each page is one label image) with no libraries.
async function buildLabelsPdf(items) {
  const cache = new Map();
  const pages = [];
  for (const item of items) {
    const key = `${item.barcode}|${item.name}|${item.price}|${handworkText(item.handwork)}`;
    if (!cache.has(key)) cache.set(key, await canvasToJpegBytes(drawLabelCanvas(item)));
    pages.push(cache.get(key));
  }
  const enc = new TextEncoder();
  const chunks = [];
  const offsets = [];
  let offset = 0;
  const push = (d) => {
    const u = typeof d === 'string' ? enc.encode(d) : d;
    chunks.push(u);
    offset += u.length;
  };
  const PW = 141.73; // 50mm in points
  const PH = 70.87; // 25mm in points
  const n = pages.length;
  push('%PDF-1.4\n');
  offsets[1] = offset;
  push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offsets[2] = offset;
  push(`2 0 obj\n<< /Type /Pages /Kids [${pages.map((_, i) => `${3 + 3 * i} 0 R`).join(' ')}] /Count ${n} >>\nendobj\n`);
  pages.forEach((bytes, i) => {
    const p = 3 + 3 * i;
    const c = p + 1;
    const im = p + 2;
    offsets[p] = offset;
    push(`${p} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${c} 0 R >>\nendobj\n`);
    const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    offsets[c] = offset;
    push(`${c} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    offsets[im] = offset;
    push(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width 400 /Height 200 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);
    push(bytes);
    push('\nendstream\nendobj\n');
  });
  const total = 2 + 3 * n;
  const xrefPos = offset;
  let xref = `xref\n0 ${total + 1}\n0000000000 65535 f \n`;
  for (let k = 1; k <= total; k++) xref += `${String(offsets[k]).padStart(10, '0')} 00000 n \n`;
  push(xref);
  push(`trailer\n<< /Size ${total + 1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`);
  return new Blob(chunks, { type: 'application/pdf' });
}

// Converts a canvas to ESC/POS raster commands (GS v 0), sent in bands so small
// printer buffers don't overflow. Dark pixels become black dots.
function canvasToEscPos(canvas) {
  const W = canvas.width;
  const H = canvas.height;
  const bytesPerRow = Math.ceil(W / 8);
  const px = canvas.getContext('2d').getImageData(0, 0, W, H).data;
  const out = [0x1b, 0x40]; // ESC @ — reset
  const BAND = 64;
  for (let y0 = 0; y0 < H; y0 += BAND) {
    const rows = Math.min(BAND, H - y0);
    out.push(0x1d, 0x76, 0x30, 0x00, bytesPerRow & 255, bytesPerRow >> 8, rows & 255, rows >> 8);
    for (let y = y0; y < y0 + rows; y++) {
      for (let bx = 0; bx < bytesPerRow; bx++) {
        let b = 0;
        for (let k = 0; k < 8; k++) {
          const x = bx * 8 + k;
          if (x < W) {
            const i = (y * W + x) * 4;
            const lum = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
            if (lum < 160) b |= 0x80 >> k;
          }
        }
        out.push(b);
      }
    }
  }
  out.push(0x1b, 0x64, 3); // ESC d 3 — feed 3 lines
  return Uint8Array.from(out);
}

// Writes bytes to a BLE characteristic in chunks, dropping to the 20-byte minimum if a larger write is refused.
async function btWrite(char, bytes) {
  let chunk = 180;
  let i = 0;
  while (i < bytes.length) {
    try {
      const part = bytes.slice(i, i + chunk);
      if (char.properties.writeWithoutResponse) await char.writeValueWithoutResponse(part);
      else await char.writeValue(part);
      i += chunk;
      await new Promise((r) => setTimeout(r, 15));
    } catch (e) {
      if (chunk > 20) chunk = 20;
      else throw e;
    }
  }
}

      email: (j.user && j.user.email) || (session && session.email) || '',
    };
    saveSession();
  }
  async function authCall(grant, body) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(j.error_description || j.msg || j.message || 'Sign-in failed');
      err.status = res.status;
      throw err;
    }
    return j;
  }
  async function signIn(email, password) {
    const j = await authCall('password', { email: String(email).trim(), password });
    takeTokens(j);
    return session.email;
  }
  async function refresh() {
    if (!session || !session.refresh_token) throw new Error('Not signed in');
    const j = await authCall('refresh_token', { refresh_token: session.refresh_token });
    takeTokens(j);
  }
  // Returns the signed-in email if a saved session still works, else ''.
  async function restore() {
    session = loadSession();
    if (!session || !session.access_token) {
      session = null;
      return '';
    }
    try {
      if (session.expires_at - 30 < Date.now() / 1000) await refresh();
      return session.email || 'staff';
    } catch (e) {
      // Only drop the session if the server actually rejected it; offline keeps it for later.
      if (e && e.status && e.status >= 400 && e.status < 500) {
        session = null;
        saveSession();
        return '';
      }
      return session.email || 'staff';
    }
  }
  function signOut() {
    session = null;
    saveSession();
    Object.keys(caches).forEach((k) => delete caches[k]);
  }
  async function rest(path, opts = {}) {
    if (!session) throw new Error('Not signed in');
    if (session.expires_at - 30 < Date.now() / 1000) await refresh();
    const go = () =>
      fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        ...opts,
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
    let res = await go();
    if (res.status === 401) {
      await refresh();
      res = await go();
    }
    if (!res.ok) {
      const t = await res.text().catch(() => '');
      throw new Error(`Database error ${res.status}: ${t.slice(0, 160)}`);
    }
    return res.status === 204 ? null : res.json().catch(() => null);
  }
  // Every row of a collection (id + updated_at only), 1000 at a time.
  async function listStamps(name) {
    const out = [];
    for (let from = 0; ; from += 1000) {
      const rows = await rest(`pos_docs?collection=eq.${encodeURIComponent(name)}&select=id,updated_at&order=id&limit=1000&offset=${from}`);
      out.push(...rows);
      if (rows.length < 1000) break;
    }
    return out;
  }
  // Brings a collection up to date by downloading only rows that are new or changed.
  // Returns { changed, list } without committing, so the caller can drop it if a write raced it.
  async function pull(name) {
    const have = cache(name);
    const stamps = await listStamps(name);
    const next = new Map();
    const need = [];
    let changed = stamps.length !== have.size;
    for (const s of stamps) {
      const old = have.get(s.id);
      if (old && old.updated_at === s.updated_at) next.set(s.id, old);
      else {
        need.push(s.id);
        changed = true;
      }
    }
    for (let i = 0; i < need.length; i += 15) {
      const chunk = need.slice(i, i + 15);
      const inList = chunk.map((id) => `"${String(id).replace(/"/g, '\\"')}"`).join(',');
      const rows = await rest(`pos_docs?collection=eq.${encodeURIComponent(name)}&id=in.(${encodeURIComponent(inList)})&select=id,updated_at,data`);
      rows.forEach((r) => next.set(r.id, { updated_at: r.updated_at, data: r.data }));
    }
    for (const id of next.keys()) if (!next.get(id).data) next.delete(id);
    return { changed, next, list: Array.from(next.values()).map((v) => v.data) };
  }
  function commit(name, res) {
    caches[name] = res.next;
  }
  async function upsert(name, id, data) {
    pending++;
    writeSeq++;
    try {
      const rows = await rest('pos_docs?on_conflict=collection,id&select=id,updated_at', {
        method: 'POST',
        headers: { Prefer: 'resolution=merge-duplicates,return=representation' },
        body: JSON.stringify({ collection: name, id: String(id), data }),
      });
      const r = rows && rows[0];
      cache(name).set(String(id), { updated_at: r ? r.updated_at : '', data });
    } finally {
      pending--;
      writeSeq++;
    }
  }
  async function remove(name, id) {
    pending++;
    writeSeq++;
    try {
      await rest(`pos_docs?collection=eq.${encodeURIComponent(name)}&id=eq.${encodeURIComponent(String(id))}`, { method: 'DELETE' });
      cache(name).delete(String(id));
    } finally {
      pending--;
      writeSeq++;
    }
  }
  async function rpc(name, args) {
    return rest(`rpc/${name}`, { method: 'POST', body: JSON.stringify(args || {}) });
  }
  // Same shape as Claude's own storage, so the rest of the app doesn't care which one it has.
  const db = {
    isSupabase: true,
    collection(name) {
      return {
        async get() {
          const res = await pull(name);
          commit(name, res);
          return { docs: res.list.map((d) => ({ data: () => d })) };
        },
        doc(id) {
          return { set: (item) => upsert(name, id, item), delete: () => remove(name, id) };
        },
      };
    },
  };
  return {
    db,
    signIn,
    restore,
    signOut,
    pull,
    commit,
    email: () => (session && session.email) || '',
    role: async () => {
      const r = await rpc('pos_my_role');
      return r === 'admin' ? 'admin' : 'staff';
    },
    nextInvoice: (fy) => rpc('pos_next_invoice', { fy }),
    busy: () => pending > 0,
    seq: () => writeSeq,
  };
})();


// Full-screen photo viewer: swipe/tap thumbnails to change photo, tap the photo to zoom in and drag to look around.
function PhotoViewer({ product, onClose }) {
  const photos = product.images && product.images.length ? product.images : product.image ? [product.image] : [];
  const [idx, setIdx] = useState(0);
  const [zoomed, setZoomed] = useState(false);
  const touchX = useRef(null);
  function go(d) {
    setZoomed(false);
    setIdx((i) => (i + d + photos.length) % photos.length);
  }
  return (
    <div className="fixed inset-0 z-30 flex flex-col" style={{ background: 'rgba(0,0,0,0.94)' }}>
      <div className="flex items-center justify-between px-4 py-3 text-white">
        <div className="min-w-0">
          <div className="text-sm font-medium truncate">{product.name}</div>
          <div className="text-xs" style={{ color: '#D9CDBF' }}>{formatINR(product.price)}{photos.length > 1 ? ` · photo ${idx + 1} of ${photos.length}` : ''}</div>
        </div>
        <button type="button" onClick={onClose} className="p-2"><X size={24} color="#fff" /></button>
      </div>
      <div
        className="flex-1 overflow-auto"
        style={{ touchAction: zoomed ? 'pan-x pan-y' : 'pan-y' }}
        onTouchStart={(e) => { touchX.current = e.touches[0].clientX; }}
        onTouchEnd={(e) => {
          if (zoomed || photos.length < 2 || touchX.current == null) return;
          const dx = e.changedTouches[0].clientX - touchX.current;
          if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
          touchX.current = null;
        }}
      >
        {photos.length ? (
          <div style={{ width: zoomed ? '250%' : '100%', height: zoomed ? 'auto' : '100%', display: 'flex', alignItems: zoomed ? 'flex-start' : 'center', justifyContent: 'center' }}>
            <img
              src={photos[idx]}
              alt={product.name}
              onClick={() => setZoomed((z) => !z)}
              style={zoomed ? { width: '100%', height: 'auto', cursor: 'zoom-out' } : { maxWidth: '100%', maxHeight: '100%', objectFit: 'contain', cursor: 'zoom-in' }}
            />
          </div>
        ) : (
          <div className="text-center text-sm py-20" style={{ color: '#D9CDBF' }}>No photo for this suit</div>
        )}
      </div>
      <div className="px-4 py-3 flex items-center justify-center gap-2">
        {photos.length > 1 && photos.map((src, i) => (
          <button key={i} type="button" onClick={() => { setZoomed(false); setIdx(i); }} className="rounded-md overflow-hidden" style={{ width: 52, height: 52, border: i === idx ? '2px solid #fff' : '2px solid transparent', opacity: i === idx ? 1 : 0.6 }}>
            <img src={src} alt="" className="w-full h-full object-cover" />
          </button>
        ))}
        <div className="text-xs ml-2" style={{ color: '#D9CDBF' }}>{zoomed ? 'Tap photo to zoom out' : 'Tap photo to zoom in'}</div>
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  async function submit(e) {
    e.preventDefault();
    if (busy) return;
    setBusy(true);
    setError('');
    try {
      await onLogin(email, password);
    } catch (err) {
      setError(err && err.message ? err.message : 'Could not sign in');
      setBusy(false);
    }
  }
  return (
    <div className="flex items-center justify-center h-full px-6" style={{ background: COLORS.bg }}>
      <form onSubmit={submit} className="w-full max-w-sm rounded-2xl p-6" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}` }}>
        <img src={LOGO_DATA_URI} alt="Aaraa Creation" style={{ height: '34px', width: 'auto', display: 'block', marginBottom: '10px' }} />
        <div className="text-lg font-semibold mb-1" style={{ color: COLORS.ink }}>Staff sign in</div>
        <div className="text-xs mb-4" style={{ color: COLORS.inkSoft }}>Use the email and password given to you. Everyone signed in shares the same suits and sales.</div>
        <input type="email" autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email" className="w-full rounded-xl px-3 py-3 mb-2 text-base outline-none" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, background: COLORS.bg }} />
        <input type="password" autoComplete="current-password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Password" className="w-full rounded-xl px-3 py-3 mb-3 text-base outline-none" style={{ border: `1px solid ${COLORS.border}`, color: COLORS.ink, background: COLORS.bg }} />
        {error && <div className="text-xs mb-3" style={{ color: COLORS.rust }}>{error}</div>}
        <button type="submit" disabled={busy || !email.trim() || !password} className="w-full rounded-xl py-3 font-medium text-white" style={{ background: COLORS.primary, opacity: busy || !email.trim() || !password ? 0.5 : 1 }}>
          {busy ? 'Signing in…' : 'Sign in'}
        </button>
      </form>
    </div>
  );
}

function AaraaPOS() {

  const [cameraOpen, setCameraOpen] = useState(false);

  const [viewingBillId, setViewingBillId] = useState(null);
  const [refreshing, setRefreshing] = useState(false);
  const [cloud, setCloud] = useState(false); // using the shared online database
  const [needLogin, setNeedLogin] = useState(false);
  const [cloudEmail, setCloudEmail] = useState('');
  const [viewPhoto, setViewPhoto] = useState(null); // suit whose photo is open full-screen
  const [role, setRole] = useState(''); // 'admin' | 'staff' ('' until known); only meaningful on the shared database
  const [localLeft, setLocalLeft] = useState(null); // suits/sales on this device that aren't in the shared database yet
  const localCheckedRef = useRef(false);
  // Staff (everyone except admins) can sell and add suits, but not edit/delete or see totals. Unknown role counts as staff.
  const isStaff = cloud && role !== 'admin';
  const scanRef = useRef(null);
  const scanTimerRef = useRef(null); // pending auto-submit of a scanner burst
  const scanBufRef = useRef(''); // latest scan-box text, updated instantly (state lags a render behind fast scanners)
  const scanChangeRef = useRef(null); // always points at the latest handleScanChange
  const scanEnterRef = useRef(null); // always points at the latest handleScanSubmit
  const scanClearRef = useRef(null); // clears the scan buffer and shows a message
  const [diagOpen, setDiagOpen] = useState(false); // "Scanner test" panel
  const [pairOpen, setPairOpen] = useState(false); // "Pair scanner" panel
  const [lastScanAt, setLastScanAt] = useState(0); // when scanner-speed typing was last seen
  const [diagLog, setDiagLog] = useState([]);
  const diagOnRef = useRef(false);
  const scanLastKeyRef = useRef(0);
  const scanFastRef = useRef(true);
  const btRef = useRef(null); // connected Bluetooth printer: { device, char }
  const [btName, setBtName] = useState('');
  const dbRef = useRef(null); // Claude's shared storage, once resolved
  const productsRef = useRef([]); // mirrors `products`, for diffing writes without stale closures
  const salesRef = useRef([]); // mirrors `sales`, same reason

  useEffect(() => {
    productsRef.current = products;
  }, [products]);

  useEffect(() => {
    salesRef.current = sales;
  }, [sales]);

  useEffect(() => {
    if (printRequested) {
      window.print();
      setPrintRequested(false);
    }
  }, [printRequested]);

  const loadData = useCallback(async () => {
    const db = dbRef.current;
    if (!db) {
      // No shared storage reachable (e.g. opened outside claude.ai) — fall back
      // to this browser's own local storage so the app still works standalone.
      const savedP = await localStore.get('aaraa_products');
      setProducts(Array.isArray(savedP) ? savedP : []);
      const savedS = await localStore.get('aaraa_sales');
      setSales(Array.isArray(savedS) ? savedS : []);
      return;
    }
    try {
      const snap = await db.collection('products').get();
      const list = snap.docs.map((d) => d.data());
      list.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
      setProducts(list);
    } catch (e) {
      console.error('load products failed', e);
    }
    try {
      const snap = await db.collection('sales').get();
      const list = snap.docs.map((d) => d.data());
      list.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
      setSales(list);
    } catch (e) {
      console.error('load sales failed', e);
    }
  }, []);

  useEffect(() => {
    (async () => {
      let db = await getClaudeDb();
      if (!db) {
        // Outside claude.ai: use the shared online database, after staff sign in.
        const who = await supa.restore();
        if (!who) {
          setNeedLogin(true);
          setLoaded(true);
          return;
        }
        db = supa.db;
        setCloudEmail(who);
        setCloud(true);
        try { setRole(await supa.role()); } catch (e) { setRole('staff'); }
      }
      dbRef.current = db;
      await loadData();
      setLoaded(true);
    })();
  }, [loadData]);

  async function handleLogin(email, password) {
    const who = await supa.signIn(email, password);
    dbRef.current = supa.db;
    setCloudEmail(who);
    setCloud(true);
    try { setRole(await supa.role()); } catch (e) { setRole('staff'); }
    setNeedLogin(false);
    await loadData();
  }

  function handleSignOut() {
    supa.signOut();
    dbRef.current = null;
    productsRef.current = [];
    salesRef.current = [];
    setProducts([]);
    setSales([]);
    localCheckedRef.current = false;
    setLocalLeft(null);
    setCloud(false);
    setCloudEmail('');
    setRole('');
    setNeedLogin(true);
  }

  // Quietly pulls other staff's changes (new suits, sales, stock) into this screen.
  const pollCloud = useCallback(async () => {
    if (!supa.email() || supa.busy()) return;
    const seq = supa.seq();
    try {
      const [p, s] = await Promise.all([supa.pull('products'), supa.pull('sales')]);
      if (supa.busy() || seq !== supa.seq()) return; // a save happened meanwhile; try again next time
      if (p.changed) {
        supa.commit('products', p);
        const list = [...p.list].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
        productsRef.current = list;
        setProducts(list);
      }
      if (s.changed) {
        supa.commit('sales', s);
        const list = [...s.list].sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
        salesRef.current = list;
        setSales(list);
      }
    } catch (e) {
      console.error('background refresh failed', e);
    }
  }, []);

  useEffect(() => {
    if (!cloud) return;
    const t = setInterval(() => {
      if (document.visibilityState === 'visible') pollCloud();
    }, 8000);
    const onVis = () => document.visibilityState === 'visible' && pollCloud();
    document.addEventListener('visibilitychange', onVis);
    return () => {
      clearInterval(t);
      document.removeEventListener('visibilitychange', onVis);
    };
  }, [cloud, pollCloud]);

  // First time on a device: offer to move suits/sales saved on it into the shared database.
  useEffect(() => {
    if (!loaded || !cloud || role !== 'admin' || localCheckedRef.current) return;
    localCheckedRef.current = true;
    (async () => {
      const lp = await localStore.get('aaraa_products');
      const ls = await localStore.get('aaraa_sales');
      const haveP = new Set(productsRef.current.map((x) => x.barcode));
      const haveS = new Set(salesRef.current.map((x) => x.id));
      const p = (Array.isArray(lp) ? lp : []).filter((x) => x && !haveP.has(x.barcode));
      const sl = (Array.isArray(ls) ? ls : []).filter((x) => x && !haveS.has(x.id));
      if (p.length || sl.length) setLocalLeft({ p, s: sl });
    })();
  }, [loaded, cloud, role]);

  async function uploadLocalData() {
    if (!localLeft) return;
    const { p, s: sl } = localLeft;
    let ok = true;
    if (p.length) ok = (await persistProducts([...p, ...productsRef.current])) && ok;
    if (sl.length) {
      const merged = [...sl, ...salesRef.current].sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
      ok = (await persistSales(merged)) && ok;
    }
    if (ok) {
      await localStore.set('aaraa_products', []);
      await localStore.set('aaraa_sales', []);
      setLocalLeft(null);
      setToast(`Uploaded ${p.length} suits and ${sl.length} sales to the shared database`);
    } else {
      setToast('Upload failed — check the internet and try again');
    }
  }

  async function handleRefresh() {
    setRefreshing(true);
    await loadData();
    setRefreshing(false);
    setToast('Refreshed');
  }

  useEffect(() => {
    if (tab === 'sell' && !editing) {
      scanRef.current?.focus();
    }
  }, [tab, editing]);

  // A scanner gun types like a physical keyboard. Read those keystrokes directly (whether or not
  // the scan box has focus) into one buffer, so nothing is lost or doubled when focus moves.
  // On-screen-keyboard typing is left to the scan box itself (those keys report code 229).
  const sellModalOpen = !!(editing || cameraOpen || printOpen || viewingBillId || editingSale);
  diagOnRef.current = diagOpen;
  useEffect(() => {
    if (tab !== 'sell' || sellModalOpen) return;
    let lastEvt = 0;
    let lastChar = '';
    let runLen = 0; // how many times in a row the same character has arrived at key-repeat speed
    let stuck = false;
    // Keys currently held (key-down seen, key-up not yet). A key-down for a key that is still
    // held is the keyboard auto-repeating, not a new character — but only trust this once this
    // scanner has shown it sends key-up events (otherwise identical digits would be dropped).
    const held = new Map();
    let keyUpSeen = false;
    function onKeyUp(e) {
      if (e.key.length !== 1) return;
      if (diagOnRef.current) {
        const t = Date.now();
        setDiagLog((prev) => [...prev, `^${e.key}+${lastEvt ? t - lastEvt : 0}`].slice(-80));
        lastEvt = t;
      }
      if (e.keyCode !== 229) { keyUpSeen = true; held.delete(e.key); }
    }
    function onKey(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const el = document.activeElement;
      const tag = el && el.tagName;
      const inScanBox = el === scanRef.current;
      if (!inScanBox && (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT')) return; // typing in another field
      const now = Date.now();
      const gap = lastEvt ? now - lastEvt : 9999;
      if (diagOnRef.current) {
        const name = e.key === ' ' ? 'space' : e.key;
        const token = `${name}${e.repeat ? '(R)' : ''}+${gap > 9000 ? 0 : gap}`;
        setDiagLog((prev) => [...prev, token].slice(-60));
      }
      lastEvt = now;
      const hardwareChar = e.key.length === 1 && e.keyCode !== 229 && !e.isComposing;
      if (hardwareChar) {
        e.preventDefault();
        if (gap > 400) held.clear();
        if (keyUpSeen && held.has(e.key)) return; // auto-repeat of a key that was never released
        held.set(e.key, now);
        if (gap < 120 && now - (onKey.lastSet || 0) > 1000) { onKey.lastSet = now; setLastScanAt(now); }
        if (stuck) {
          // Ignore the flood until the keyboard has been quiet for a moment.
          if (gap < 400) return;
          stuck = false;
          runLen = 0;
        }
        if (e.key === lastChar && gap < 90) runLen += 1;
        else runLen = 1;
        lastChar = e.key;
        if (e.repeat) return; // a held key — the OS is repeating it, not the scanner
        if (runLen >= 6) {
          // Six identical characters at key-repeat speed is a stuck key, not a barcode.
          stuck = true;
          if (scanClearRef.current) scanClearRef.current(`Scanner got stuck repeating "${e.key}". Scan again (turn the scanner off and on if it keeps happening).`);
          return;
        }
        if (scanChangeRef.current) scanChangeRef.current(scanBufRef.current + e.key);
      } else if ((e.key === 'Enter' || e.key === 'Tab') && !inScanBox && scanBufRef.current) {
        e.preventDefault();
        if (scanEnterRef.current) scanEnterRef.current(scanBufRef.current);
      }
    }
    window.addEventListener('keydown', onKey, true);
    window.addEventListener('keyup', onKeyUp, true);
    return () => {
      window.removeEventListener('keydown', onKey, true);
      window.removeEventListener('keyup', onKeyUp, true);
    };
  }, [tab, sellModalOpen]);

  // Catalog tab: a scanner gun types the barcode into the search box. Keep that box ready, and
  // if a scan arrives while focus is elsewhere, send it there.
  const catalogBlocked = !!(editing || cameraOpen || printOpen || viewingBillId || editingSale || viewPhoto);
  useEffect(() => {
    if (tab !== 'catalog' || catalogBlocked) return;
    const t = setTimeout(() => catalogSearchRef.current && catalogSearchRef.current.focus(), 80);
    function onKey(e) {
      if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
      const el = document.activeElement;
      const tag = el && el.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      const box = catalogSearchRef.current;
      if (box) {
        box.focus();
        box.select();
      }
    }
    window.addEventListener('keydown', onKey, true);
    return () => {
      clearTimeout(t);
      window.removeEventListener('keydown', onKey, true);
    };
  }, [tab, catalogBlocked]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(''), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  useEffect(() => {
    if (viewingBillId && !sales.some((s) => (s.billId || s.id) === viewingBillId)) {
      setViewingBillId(null);
    }
  }, [viewingBillId, sales]);

  // Writes only the documents that actually changed between `prev` and `next`
  // (by the given id field), plus deletes for anything removed — instead of
  // rewriting the whole collection on every save.
  async function syncCollection(db, collectionPath, prev, next, idField) {
    const prevMap = new Map(prev.map((item) => [item[idField], item]));
    const nextMap = new Map(next.map((item) => [item[idField], item]));
    const ops = [];
    for (const [id, item] of nextMap) {
      const old = prevMap.get(id);
      if (!old || JSON.stringify(old) !== JSON.stringify(item)) {
        ops.push(db.collection(collectionPath).doc(String(id)).set(item));
      }
    }
    for (const [id] of prevMap) {
      if (!nextMap.has(id)) {
        ops.push(db.collection(collectionPath).doc(String(id)).delete());
      }
    }
    await Promise.all(ops);
  }

  const persistProducts = useCallback(async (next) => {
    const prev = productsRef.current;
    setProducts(next);
    productsRef.current = next;
    const db = dbRef.current;
    if (!db) {
      return await localStore.set('aaraa_products', next);
    }
    try {
      await syncCollection(db, 'products', prev, next, 'barcode');
      return true;
    } catch (e) {
      console.error('save products failed', e);
      return false;
    }
  }, []);

  const persistSales = useCallback(async (next) => {
    const prev = salesRef.current;
    setSales(next);
    salesRef.current = next;
    const db = dbRef.current;
    if (!db) {
      return await localStore.set('aaraa_sales', next);
    }
    try {
      await syncCollection(db, 'sales', prev, next, 'id');
      return true;
    } catch (e) {
      console.error('save sales failed', e);
      return false;
    }
  }, []);

  async function updateSaleRecord(original, updated) {
    const qty = Math.max(0, Number(updated.qty) || 0);
    const price = Math.max(0, Number(updated.price) || 0);
    if (qty === 0) return 'invalid';
    const qtyDelta = qty - original.qty;
    const nextSales = sales.map((s) =>
      s.id === original.id
        ? { ...s, qty, price, total: qty * price, note: updated.note.trim() || null, paymentSplit: updated.paymentSplit, paymentMode: undefined }
        : s
    );
    const ok = await persistSales(nextSales);
    if (!ok) return 'failed';
    if (qtyDelta !== 0) {
      const nextProducts = products.map((p) =>
        p.barcode === original.barcode && p.stock !== '' && p.stock != null
          ? { ...p, stock: Math.max(0, Number(p.stock) - qtyDelta) }
          : p
      );
      await persistProducts(nextProducts);
    }
    return true;
  }

  async function deleteSaleRecord(sale) {
    const nextSales = sales.filter((s) => s.id !== sale.id);
    const ok = await persistSales(nextSales);
    if (!ok) return false;
    const nextProducts = products.map((p) =>
      p.barcode === sale.barcode && p.stock !== '' && p.stock != null
        ? { ...p, stock: Number(p.stock) + sale.qty }
        : p
    );
    await persistProducts(nextProducts);
    return true;
  }

  function addProductToCart(product) {
    const existing = cart.find((c) => c.barcode === product.barcode);
    const inCartQty = existing ? existing.qty : 0;
    if (product.stock !== '' && product.stock != null && inCartQty + 1 > Number(product.stock)) {
      setScanError(`Only ${product.stock} in stock for "${product.name}"`);
      return false;
    }
    setScanError('');
    if (existing) {
      setCart(cart.map((c) => (c.barcode === product.barcode ? { ...c, qty: c.qty + 1 } : c)));
    } else {
      setCart([
        ...cart,
        { barcode: product.barcode, name: product.name, price: Number(product.price), qty: 1, image: product.image, stock: product.stock },
      ]);
    }
    return true;
  }

  // Called by the camera scanner for each detected barcode; returns a status line to show on the scanner.
  function handleCameraScan(code) {
    if (tab === 'catalog') {
      // On the Catalog tab a scan just searches for that barcode.
      setSearch(code);
      setCameraOpen(false);
      return { ok: true, text: `Searching ${code}` };
    }
    const product = products.find((p) => p.barcode === code);
    if (!product) return { ok: false, text: `No suit found for ${code}` };
    const added = addProductToCart(product);
    return added
      ? { ok: true, text: `Added: ${product.name}` }
      : { ok: false, text: `Only ${product.stock} in stock for "${product.name}"` };
  }

  // Bluetooth/USB scanner guns type the code very fast (and usually end with Enter).
  // If the code arrives as a fast burst but no Enter follows, submit it after a short pause.
  // Slow, manual typing is never auto-submitted — that still needs Enter.
  function handleScanChange(v) {
    if (v.length > 40) {
      // No real barcode is this long — the scanner is stuck repeating a key.
      clearTimeout(scanTimerRef.current);
      scanBufRef.current = '';
      setScanValue('');
      setScanError('The scanner is repeating a key. Turn it off and on, or re-pair it, then scan again.');
      return;
    }
    scanBufRef.current = v;
    const now = Date.now();
    if (v.length <= 1 || now - scanLastKeyRef.current > 500) scanFastRef.current = true;
    else if (now - scanLastKeyRef.current > 60) scanFastRef.current = false;
    scanLastKeyRef.current = now;
    setScanValue(v);
    clearTimeout(scanTimerRef.current);
    if (scanFastRef.current && v.length >= 3) {
      scanTimerRef.current = setTimeout(() => handleScanSubmit(v), 150);
    }
  }

  scanChangeRef.current = handleScanChange;
  scanEnterRef.current = (v) => handleScanSubmit(v);
  scanClearRef.current = (msg) => {
    clearTimeout(scanTimerRef.current);
    scanBufRef.current = '';
    setScanValue('');
    if (msg) setScanError(msg);
  };

  function handleScanSubmit(codeArg) {
    clearTimeout(scanTimerRef.current);
    const code = (typeof codeArg === 'string' ? codeArg : scanBufRef.current || scanValue).trim();
    scanBufRef.current = '';
    if (!code) return;
    let product = products.find((p) => p.barcode === code);
    if (!product && code.length >= 4) {
      // This scanner sometimes loses the last character. If the code is exactly one
      // character short of one suit's barcode, use that suit; if it fits several, don't guess.
      const near = products.filter((p) => p.barcode.length === code.length + 1 && p.barcode.startsWith(code));
      if (near.length === 1) {
        product = near[0];
      } else if (near.length > 1) {
        setScanError(`Scanner sent "${code}" — that fits ${near.length} suits (${near.slice(0, 3).map((p) => p.barcode).join(', ')}). Scan again.`);
        setScanValue('');
        return;
      }
    }
    if (!product) {
      setScanError(`No suit found for barcode "${code}"`);
      setScanValue('');
      return;
    }
    addProductToCart(product);
    setScanValue('');
  }

  function updateCartQty(barcode, delta) {
    setCart((prev) =>
      prev.map((c) => (c.barcode === barcode ? { ...c, qty: Math.max(0, c.qty + delta) } : c)).filter((c) => c.qty > 0)
    );
  }

  function removeFromCart(barcode) {
    setCart((prev) => prev.filter((c) => c.barcode !== barcode));
  }

  function updateCartPrice(barcode, price) {
    setCart((prev) => prev.map((c) => (c.barcode === barcode ? { ...c, price: Math.max(0, price) } : c)));
  }

  const cartSubtotal = cart.reduce((sum, c) => sum + c.price * c.qty, 0);
  const overrideNum = finalOverride.trim() === '' ? null : Math.round(Number(finalOverride));
  const hasOverride = overrideNum !== null && Number.isFinite(overrideNum) && overrideNum >= 0 && cartSubtotal > 0;
  const cartTotal = hasOverride ? overrideNum : cartSubtotal; // what the customer actually pays
  const cartDiscount = cartSubtotal - cartTotal;
  // A changed cart (item added/removed, price or quantity edited) invalidates a bargained total.
  useEffect(() => { setFinalOverride(''); }, [cartSubtotal]);
  const paymentAssigned = (Number(payCash) || 0) + (Number(payOnline) || 0) + (Number(payDue) || 0);
  const needsInvoice = (Number(payOnline) || 0) > 0; // an online payment needs a tax invoice
  const custMobileClean = custMobile.replace(/\D/g, '').replace(/^91(?=\d{10}$)/, '');
  const partlyOnline = needsInvoice && (Number(payCash) || 0) + (Number(payDue) || 0) > 0;
  const invoiceMissing = needsInvoice && (!custName.trim() || custMobileClean.length !== 10 || (partlyOnline && !invoiceBasis));

  function holdCurrentCart() {
    if (cart.length === 0) return;
    const label = saleNote.trim() || `Held sale ${heldCarts.length + 1}`;
    setHeldCarts((prev) => [
      ...prev,
      { id: `hold-${Date.now()}`, label, cart, note: saleNote, payCash, payOnline, payDue, heldAt: new Date().toISOString() },
    ]);
    setCart([]);
    setFinalOverride('');
    setCustName('');
    setCustMobile('');
    setInvoiceBasis('');
    setSaleNote('');
    setPayCash('');
    setPayOnline('');
    setPayDue('');
    setScanError('');
    setToast('Sale held — ready for the next customer');
  }

  function resumeHeldCart(id) {
    const held = heldCarts.find((h) => h.id === id);
    if (!held) return;
    if (cart.length > 0) {
      // Don't lose what's currently active — park it too before switching.
      const currentLabel = saleNote.trim() || `Held sale ${heldCarts.length + 1}`;
      setHeldCarts((prev) => [
        ...prev.filter((h) => h.id !== id),
        { id: `hold-${Date.now()}`, label: currentLabel, cart, note: saleNote, payCash, payOnline, payDue, heldAt: new Date().toISOString() },
      ]);
    } else {
      setHeldCarts((prev) => prev.filter((h) => h.id !== id));
    }
    setCart(held.cart);
    setFinalOverride('');
    setCustName('');
    setCustMobile('');
    setInvoiceBasis('');
    setSaleNote(held.note);
    setPayCash(held.payCash);
    setPayOnline(held.payOnline);
    setPayDue(held.payDue);
    setScanError('');
  }

  function discardHeldCart(id) {
    setHeldCarts((prev) => prev.filter((h) => h.id !== id));
    setToast('Held sale discarded');
  }

  async function completeSale() {
    if (cart.length === 0 || saleInProgress) return;
    if (paymentAssigned !== cartTotal) {
      setScanError(
        paymentAssigned < cartTotal
          ? `Assign the remaining ${formatINR(cartTotal - paymentAssigned)} to Cash, Online, or Due before completing the sale`
          : `Cash + Online + Due is ${formatINR(paymentAssigned - cartTotal)} over the total — adjust before completing the sale`
      );
      return;
    }
    if ((Number(payDue) || 0) > 0 && !saleNote.trim()) {
      setScanError('Add the customer\'s name and phone number in the Note field before completing a sale with a due amount');
      return;
    }
    if (invoiceMissing) {
      setScanError(
        partlyOnline && !invoiceBasis && custName.trim() && custMobileClean.length === 10
          ? 'Choose whether the invoice is for the full bill or the online amount only'
          : 'Online payment needs an invoice — enter the customer\'s name and a 10-digit mobile number'
      );
      return;
    }
    setSaleInProgress(true);
    if (cloud) await pollCloud(); // other staff may have just sold the same suit

    // Re-check stock against the latest data right before committing, in case it
    // changed since items were scanned (e.g. an earlier accidental double-tap).
    const shortages = [];
    for (const c of cart) {
      const live = productsRef.current.find((p) => p.barcode === c.barcode);
      if (live && live.stock !== '' && live.stock != null && Number(live.stock) < c.qty) {
        shortages.push({ name: c.name, available: Number(live.stock) });
      }
    }
    if (shortages.length > 0) {
      setSaleInProgress(false);
      const s = shortages[0];
      setScanError(`Only ${s.available} of "${s.name}" left — remove or reduce it from the cart before completing sale`);
      return;
    }

    const now = new Date().toISOString();
    const note = saleNote.trim();
    const billId = `bill-${Date.now()}-${Math.floor(Math.random() * 10000)}`;
    const billSplit = {
      cash: Number(payCash) || 0,
      online: Number(payOnline) || 0,
      due: Number(payDue) || 0,
    };
    // Prorate the bill-level split across line items by each item's share of the
    // bill total, so summing items' splits back up gives the original amounts
    // exactly (the last item absorbs any rounding remainder).
    let cashLeft = billSplit.cash;
    let onlineLeft = billSplit.online;
    let dueLeft = billSplit.due;
    // With a bargained total, spread the final amount over the items by their share of the list
    // total (the last item takes the rounding remainder) so line totals add up to the bill exactly.
    let totalLeft = cartTotal;
    let invoiceSeq = nextInvoiceSeq(salesRef.current);
    if (needsInvoice && cloud) {
      // Staff only see today's sales, so the database hands out the next invoice number itself.
      try {
        invoiceSeq = Number(await supa.nextInvoice(invoiceFinancialYear(now)));
      } catch (e) {
        setToast('Could not get an invoice number — check the internet and try again');
        setSaleInProgress(false);
        return;
      }
    }
    const invoiceMeta = needsInvoice ? makeInvoiceMeta(invoiceSeq, now, custName.trim(), custMobileClean, partlyOnline && invoiceBasis === 'online' ? 'online' : 'full', partlyOnline && invoiceBasis === 'online' ? billSplit.online : cartTotal) : undefined;
    const newSales = cart.map((c, idx) => {
      const listTotal = c.price * c.qty;
      const isLast = idx === cart.length - 1;
      const lineTotal = isLast ? totalLeft : cartSubtotal > 0 ? Math.round((listTotal * cartTotal) / cartSubtotal) : 0;
      totalLeft -= lineTotal;
      const share = cartTotal > 0 ? lineTotal / cartTotal : 0;
      const lineCash = isLast ? cashLeft : Math.round(billSplit.cash * share);
      const lineOnline = isLast ? onlineLeft : Math.round(billSplit.online * share);
      const lineDue = isLast ? dueLeft : Math.round(billSplit.due * share);
      if (!isLast) {
        cashLeft -= lineCash;
        onlineLeft -= lineOnline;
        dueLeft -= lineDue;
      }
      return {
        id: `${Date.now()}-${c.barcode}`,
        billId,
        barcode: c.barcode,
        name: c.name,
        price: c.price,
        qty: c.qty,
        total: lineTotal,
        discount: listTotal - lineTotal > 0 ? listTotal - lineTotal : undefined,
        timestamp: now,
        note: note || null,
        paymentSplit: { cash: lineCash, online: lineOnline, due: lineDue },
        invoice: invoiceMeta,
      };
    });
    const recordedTotal = cartTotal;
    const ok = await persistSales([...newSales, ...salesRef.current]);
    if (!ok) {
      setToast('Could not save the sale — please try again');
      setSaleInProgress(false);
      return;
    }
    const nextProducts = productsRef.current.map((p) => {
      const sold = cart.find((c) => c.barcode === p.barcode);
      if (sold && p.stock !== '' && p.stock != null) {
        return { ...p, stock: Math.max(0, Number(p.stock) - sold.qty) };
      }
      return p;
    });
    await persistProducts(nextProducts);
    setCart([]);
    setSaleNote('');
    setPayCash('');
    setPayOnline('');
    setPayDue('');
    setCustName('');
    setCustMobile('');
    setInvoiceBasis('');
    setToast(`Sale recorded — ${formatINR(recordedTotal)}`);
    setSaleInProgress(false);
    if (invoiceMeta) setInvoiceItems(newSales); // show the invoice right away
  }

  // ---- Backup file: move suits and sales between the downloaded copy and the web app ----
  const importInputRef = useRef(null);
  const [backupMode, setBackupMode] = useState(null); // null | 'copy' | 'paste'
  const [backupText, setBackupText] = useState('');

  async function exportData() {
    const payload = JSON.stringify({
      app: 'aaraa-pos',
      version: 1,
      exportedAt: new Date().toISOString(),
      products: productsRef.current,
      sales: salesRef.current,
    });
    const filename = `aaraa-backup-${new Date().toISOString().slice(0, 10)}.json`;
    try {
      const downloads = await getClaudeCap('downloads');
      if (downloads) {
        await downloads.save({ filename, data: payload });
      } else {
        const url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }
      setToast(`Backup saved: ${productsRef.current.length} suits, ${salesRef.current.length} sales`);
    } catch (e) {
      if (e && e.code === 'declined') return;
      setToast('Could not create the backup file');
    }
  }

  async function importData(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      await importFromText(await file.text());
    } catch (err) {
      setToast('Could not read that backup file');
    }
  }

  // Same as above but from text (the "Paste backup" route, for screens that block the file picker).
  async function importFromText(text) {
    try {
      const data = JSON.parse(text);
      if (!data || data.app !== 'aaraa-pos' || !Array.isArray(data.products) || !Array.isArray(data.sales)) {
        setToast("That file isn't an Aaraa backup");
        return;
      }
      const haveBarcodes = new Set(productsRef.current.map((p) => p.barcode));
      const newProducts = data.products.filter((p) => p && p.barcode && !haveBarcodes.has(p.barcode));
      const haveSales = new Set(salesRef.current.map((x) => x.id));
      const newSales = data.sales.filter((x) => x && x.id != null && !haveSales.has(x.id));
      if (newProducts.length) await persistProducts([...newProducts, ...productsRef.current]);
      if (newSales.length) {
        const merged = [...salesRef.current, ...newSales].sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));
        await persistSales(merged);
      }
      const skipped = data.products.length - newProducts.length;
      setToast(`Imported ${newProducts.length} new suits and ${newSales.length} new sales${skipped ? ` (${skipped} suits already here, kept as is)` : ''}`);
      setBackupText('');
      setBackupMode(null);
    } catch (err) {
      setToast('Could not read that backup — copy it again and paste the whole text');
    }
  }

  function backupPayload() {
    return JSON.stringify({ app: 'aaraa-pos', version: 1, exportedAt: new Date().toISOString(), products: productsRef.current, sales: salesRef.current });
  }

  async function copyBackupText() {
    const text = backupPayload();
    setBackupText(text);
    setBackupMode('copy');
    try {
      await navigator.clipboard.writeText(text);
      setToast('Backup copied — open the other copy, tap Paste backup and paste it');
    } catch (e) {
      setToast('Press and hold in the box, Select all, then Copy');
    }
  }

  async function saveProduct(form) {
    const barcode = form.barcode.trim();
    if (!barcode || !form.price) return false;
    const isNew = editing === 'new';
    const dup = products.find((p) => p.barcode === barcode && (isNew || p.barcode !== editing.barcode));
    if (dup) return 'duplicate';
    const record = {
      barcode,
      name: form.name.trim() || `Suit ${barcode}`, // name is optional; fall back to the barcode so it still shows everywhere
      price: Number(form.price),
      stock: form.stock === '' ? '' : Number(form.stock),
      topFabric: form.topFabric.trim(),
      bottomFabric: form.bottomFabric.trim(),
      dupattaFabric: form.dupattaFabric.trim(),
      handwork: form.handwork || [],
      image: form.image || null, // main photo (first of `images`) — used for thumbnails everywhere
      images: form.images || (form.image ? [form.image] : []),
      createdAt: isNew ? new Date().toISOString() : editing.createdAt,
    };
    const next = isNew ? [record, ...products] : products.map((p) => (p.barcode === editing.barcode ? record : p));
    const ok = await persistProducts(next);
    if (!ok) return 'failed';
    setEditing(null);
    setToast(isNew ? 'Suit added to catalog' : 'Suit updated');
    return true;
  }

  function generateBarcode() {
    const existing = new Set(products.map((p) => p.barcode));
    let code;
    do {
      code = String(Math.floor(100000 + Math.random() * 900000));
    } while (existing.has(code));
    return code;
  }

  async function connectPrinter() {
    if (!navigator.bluetooth) {
      setToast("Bluetooth isn't available here — open the downloaded file in Chrome on Android");
      return false;
    }
    try {
      const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BT_SERVICES });
      const server = await device.gatt.connect();
      const services = await server.getPrimaryServices();
      let found = null;
      for (const s of services) {
        const chars = await s.getCharacteristics();
        for (const c of chars) {
          if (c.properties.write || c.properties.writeWithoutResponse) {
            found = c;
            break;
          }
        }
        if (found) break;
      }
      if (!found) {
        device.gatt.disconnect();
        setToast(`Connected to ${device.name || 'device'} but found no print channel (${services.length} services)`);
        return false;
      }
      device.addEventListener('gattserverdisconnected', () => {
        btRef.current = null;
        setBtName('');
      });
      btRef.current = { device, char: found };
      setBtName(device.name || 'Printer');
      setToast(`Connected: ${device.name || 'printer'}`);
      return true;
    } catch (e) {
      if (e && e.name === 'NotFoundError') return false; // picker cancelled
      setToast(`Bluetooth: ${(e && e.name) || 'error'}${e && e.message ? ' — ' + e.message : ''}`.slice(0, 140));
      return false;
    }
  }

  async function printViaBluetooth(items) {
    const conn = btRef.current;
    if (!conn) return false;
    try {
      for (const item of items) {
        await btWrite(conn.char, canvasToEscPos(drawLabelCanvas(item, 384, 192)));
      }
      setToast(`Sent ${items.length} label${items.length === 1 ? '' : 's'} to the printer`);
      return true;
    } catch (e) {
      console.error('bluetooth print failed', e);
      btRef.current = null;
      setBtName('');
      setToast('Printing failed — reconnect the printer and try again');
      return true; // handled; don't fall through to a second output
    }
  }

  async function triggerPrint(items) {
    if (items.length === 0) return;
    if (btRef.current && (await printViaBluetooth(items))) return;
    // Inside claude.ai the browser's print dialog is blocked, so instead save the
    // labels as a PDF (one 50x25mm label per page) to open in the printer's own app.
    const downloads = await getClaudeCap('downloads');
    if (downloads) {
      try {
        const blob = await buildLabelsPdf(items);
        await downloads.save({ filename: 'aaraa-labels.pdf', data: blob });
        setToast('Labels saved — open the PDF in your printer app and print');
      } catch (e) {
        if (e && e.code === 'declined') return;
        console.error('label pdf failed', e);
        setToast('Could not create the labels file');
      }
      return;
    }
    setPrintItems(items);
    setPrintRequested(true);
  }

  function togglePrintItem(product) {
    setPrintSelection((prev) => {
      const next = { ...prev };
      if (next[product.barcode]) {
        delete next[product.barcode];
      } else {
        const stockQty = product.stock !== '' && product.stock != null ? Number(product.stock) : 0;
        next[product.barcode] = stockQty > 0 ? stockQty : 1;
      }
      return next;
    });
  }

  function setPrintQty(barcode, qty) {
    setPrintSelection((prev) => ({ ...prev, [barcode]: Math.max(1, qty) }));
  }

  function handlePrintSelected() {
    const items = [];
    for (const [barcode, qty] of Object.entries(printSelection)) {
      const product = products.find((p) => p.barcode === barcode);
      if (!product || !qty) continue;
      for (let i = 0; i < qty; i++) items.push({ barcode: product.barcode, name: product.name, price: product.price, handwork: product.handwork || [] });
    }
    triggerPrint(items);
  }

  async function deleteProduct(barcode) {
    await persistProducts(products.filter((p) => p.barcode !== barcode));
    setEditing(null);
    setToast('Suit removed');

  const filteredProducts = products.filter((p) => {
    const q = search.trim().toLowerCase();
    if (!q) return true;
    return (
      p.name.toLowerCase().includes(q) ||
      p.barcode.toLowerCase().includes(q) ||
      (p.topFabric || '').toLowerCase().includes(q) ||
      (p.bottomFabric || '').toLowerCase().includes(q) ||
      (p.dupattaFabric || '').toLowerCase().includes(q)

  const todaysRevenue = todaysSales.reduce((sum, s) => sum + s.total, 0);
  const todaysBillGroups = Array.from(
    todaysSales.reduce((map, s) => {
      const key = s.billId || s.id;
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(s);
      return map;
    }, new Map())
  ).map(([, items]) => items);
  const todaysReceived = todaysBillGroups.reduce((sum, items) => {
    const sp = aggregateBillSplit(items);
    return sum + sp.cash + sp.online;
  }, 0);
  const todaysDue = todaysBillGroups.reduce((sum, items) => sum + aggregateBillSplit(items).due, 0);

  const salesByDay = sales.reduce((acc, s) => {
    const day = new Date(s.timestamp).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    acc[day] = acc[day] || [];
    acc[day].push(s);
    return acc;
  }, {});

  const billKey = (s) => s.billId || s.id;

  const billsByDay = Object.fromEntries(
    Object.entries(salesByDay).map(([day, items]) => {
      const map = new Map();
      for (const s of items) {
        const key = billKey(s);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(s);
      }
      return [day, Array.from(map.values())];
    })
  );

  const sumSplits = (bills) =>

      (acc, items) => {

        acc.cash += sp.cash;
        acc.online += sp.online;
        acc.due += sp.due;

                  className="mt-3 rounded-xl px-3 py-2"
                  style={{ background: COLORS.card, border: `1px solid ${noteMissing ? COLORS.rust : COLORS.border}` }}
                >
                  <div className="text-xs mb-0.5" style={{ color: noteMissing ? COLORS.rust : COLORS.inkSoft }}>
                    {noteRequired ? 'Note — required: customer name & phone number (due amount entered)' : 'Note (optional) — customer name, phone, discount reason, etc.'}
                  </div>
                  <input
                    value={saleNote}
                    onChange={(e) => setSaleNote(e.target.value)}
                    placeholder="e.g. Fatima, 98765xxxxx"
                    className="w-full outline-none bg-transparent text-sm"
                    style={{ color: COLORS.ink }}
                  />
                </div>
              );
            })()}
          </div>
        )}

        {tab === 'catalog' && (
          <div className="px-5 pt-4">
            <div className="flex items-center gap-2 mb-4">
              <div className="flex-1 flex items-center gap-2 rounded-xl px-3 py-2" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}` }}>
                <Search size={16} color={COLORS.inkSoft} />
                <input
                  ref={catalogSearchRef}
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  onFocus={(e) => e.target.select()}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter' || e.key === 'Tab') {
                      // A scanner ends each code with Enter: keep the result, and select the text so the next scan replaces it.
                      e.preventDefault();
                      e.target.select();
                    }
                  }}
                  placeholder="Scan, or search by name, barcode, fabric"
                  className="flex-1 outline-none bg-transparent text-sm"
                  style={{ color: COLORS.ink }}
                />
                {search && (
                  <button type="button" onClick={() => { setSearch(''); catalogSearchRef.current && catalogSearchRef.current.focus(); }} aria-label="Clear search">
                    <X size={16} color={COLORS.inkSoft} />
                  </button>
                )}
              </div>
              <button onClick={() => setCameraOpen(true)} aria-label="Scan with camera" className="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}` }}>
                <Scan size={18} color={COLORS.primary} />

              <button onClick={() => setPrintOpen(true)} className="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}` }}>

                <span>
                  Shared database · {cloudEmail} · <button type="button" onClick={handleSignOut} className="underline">Sign out</button>
                </span>
              )}
              {!isStaff && (<>
              <button type="button" onClick={exportData} className="underline">Export backup</button>
              <button type="button" onClick={copyBackupText} className="underline">Copy backup</button>
              <button type="button" onClick={() => { setBackupText(''); setBackupMode('paste'); }} className="underline">Paste backup</button>
              <label className="underline cursor-pointer">
                Import file
                <input ref={importInputRef} type="file" onChange={importData} style={{ position: 'absolute', width: 1, height: 1, opacity: 0, overflow: 'hidden' }} />
              </label>
              </>)}
            </div>
            {!isStaff && backupMode && (
              <div className="mb-3 rounded-xl p-3" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}` }}>
                <div className="text-xs mb-2" style={{ color: COLORS.inkSoft }}>
                  {backupMode === 'copy'
                    ? 'This is your backup. It was copied; if not, press and hold in the box, choose Select all, then Copy.'
                    : 'Paste the whole backup text here, then tap Import.'}
                </div>
                <textarea
                  value={backupText}
                  onChange={(e) => setBackupText(e.target.value)}
                  readOnly={backupMode === 'copy'}
                  onFocus={(e) => backupMode === 'copy' && e.target.select()}
                  rows={4}
                  className="w-full text-xs font-mono rounded-lg p-2 outline-none"
                  style={{ background: '#fff', border: `1px solid ${COLORS.border}`, color: COLORS.ink }}
                />
                <div className="flex gap-2 mt-2">
                  {backupMode === 'paste' && (
                    <button type="button" onClick={() => importFromText(backupText)} disabled={!backupText.trim()} className="flex-1 rounded-lg py-2 text-sm font-medium text-white" style={{ background: COLORS.primary, opacity: backupText.trim() ? 1 : 0.5 }}>
                      Import
                    </button>
                  )}
                  <button type="button" onClick={() => { setBackupMode(null); setBackupText(''); }} className="flex-1 rounded-lg py-2 text-sm font-medium" style={{ background: COLORS.chip, color: COLORS.primary }}>
                    Close
                  </button>
                </div>
              </div>

            {filteredProducts.length === 0 ? (
              <div className="text-center py-16" style={{ color: COLORS.inkSoft }}>
                <div className="text-sm">{products.length === 0 ? 'No suits yet. Tap + to add your first one.' : 'No matches.'}</div>
              </div>
            ) : (
              <div className="grid grid-cols-2 gap-3">
                {filteredProducts.map((p) => (
                  <button key={p.barcode} onClick={() => (isStaff ? setToast('Only the admin can edit or delete suits') : setEditing(p))} className="text-left rounded-xl overflow-hidden" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}` }}>
                    <div className="w-full aspect-square relative" style={{ background: COLORS.chip }}>
                      {p.image && <img src={p.image} alt={p.name} className="w-full h-full object-cover" />}
                      {p.image && (
                        <span
                          role="button"
                          aria-label="Zoom photo"
                          onClick={(e) => { e.stopPropagation(); setViewPhoto(p); }}
                          className="absolute flex items-center justify-center rounded-full"
                          style={{ right: 6, bottom: 6, width: 34, height: 34, background: 'rgba(43,36,30,0.65)' }}
                        >
                          <Search size={16} color="#fff" />
                        </span>
                      )}
                    </div>
                    <div className="p-2">
                      <div className="text-sm font-medium truncate" style={{ color: COLORS.ink }}>{p.name}</div>
                      <div className="text-sm" style={{ color: COLORS.gold }}>{formatINR(p.price)}</div>
                      <div className="flex items-center justify-between mt-1">
                        <span className="text-xs font-mono truncate" style={{ color: COLORS.inkSoft }}>{p.barcode}</span>
                        {p.stock !== '' && p.stock != null && (

                          </span>
                        )}
                      </div>
                    </div>
                  </button>
                ))}
              </div>
            )}
